worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    map $uri $dukkeobi_cache_control {
        default "no-cache";
        /dukkeobi/runtime-config.js "no-store";
        /dukkeobi/healthz "no-store";
        ~^/dukkeobi/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        add_header Cache-Control $dukkeobi_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net https://t1.kakaocdn.net; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.openstreetmap.org; connect-src 'self' https://dapi.kakao.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = / {
            return 308 /dukkeobi/;
        }

        location = /dukkeobi {
            return 308 /dukkeobi/;
        }

        location = /dukkeobi/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /dukkeobi/runtime-config.js {
            alias /tmp/runtime-config.js;
            default_type application/javascript;
        }

        location ^~ /dukkeobi/assets/ {
            try_files $uri =404;
        }

        location /dukkeobi/ {
            try_files $uri $uri/ /dukkeobi/index.html;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            return 404;
        }
    }
}
